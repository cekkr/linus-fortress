<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lizard Control Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Teko:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="glow"></div>

    <header class="masthead">
      <div class="brand">
        <div class="brand-mark">Lizard</div>
        <div class="brand-sub">Linux + Wizard control deck</div>
      </div>
      <div class="mast-actions">
        <div class="fortress-indicator" id="fortress-status">Fortress: ...</div>
        <button class="action ghost" data-action-id="refresh">Sync</button>
        <button class="action ghost" id="logout" hidden>Sign out</button>
      </div>
    </header>

    <main class="layout">
      <aside class="nav-tree">
        <div class="panel-title">Pages Tree</div>
        <div class="tree" id="tree"></div>
        <div class="legend">
          <div class="legend-title">Fast Actions</div>
          <div class="legend-body">
            Trigger actions from app cards without entering previews.
          </div>
        </div>
      </aside>

      <section class="stage">
        <div class="stage-top">
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="status-line" id="status-line"></div>
        </div>
        <div class="card-grid" id="app-grid"></div>
      </section>

      <aside class="inspector">
        <div class="panel">
          <div class="panel-title">Preview</div>
          <div class="preview" id="preview"></div>
        </div>
        <div class="panel wizard" id="wizard-panel">
          <div class="panel-title">Wizard</div>
          <div class="wizard-body" id="wizard"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Command Log</div>
          <div class="event-log" id="event-log"></div>
        </div>
      </aside>
    </main>

    <div class="auth-overlay" id="admin-overlay" hidden>
      <div class="auth-card">
        <div class="auth-title">Admin Access</div>
        <div class="auth-sub" id="admin-subtitle">Sign in with a UI admin account to continue.</div>
        <form class="auth-form" id="admin-form">
          <label class="auth-label" for="admin-username">Username</label>
          <input class="auth-input" id="admin-username" type="text" autocomplete="username" spellcheck="false" />
          <label class="auth-label" for="admin-password">Password</label>
          <input class="auth-input" id="admin-password" type="password" autocomplete="current-password" spellcheck="false" />
          <label class="auth-label" for="admin-totp">TOTP code (if enabled)</label>
          <input class="auth-input" id="admin-totp" type="text" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" />
          <button class="action" type="submit">Unlock</button>
        </form>
        <form class="auth-form" id="admin-bootstrap-form" hidden>
          <label class="auth-label" for="admin-bootstrap-username">Admin username</label>
          <input class="auth-input" id="admin-bootstrap-username" type="text" autocomplete="username" spellcheck="false" />
          <label class="auth-label" for="admin-bootstrap-password">Admin password</label>
          <input class="auth-input" id="admin-bootstrap-password" type="password" autocomplete="new-password" spellcheck="false" />
          <label class="auth-label" for="admin-bootstrap-confirm">Confirm password</label>
          <input class="auth-input" id="admin-bootstrap-confirm" type="password" autocomplete="new-password" spellcheck="false" />
          <button class="action" type="submit">Create admin</button>
        </form>
        <div class="auth-message" id="admin-message"></div>
      </div>
    </div>

    <div class="auth-overlay" id="auth-overlay" hidden>
      <div class="auth-card">
        <div class="auth-title">Unlock the Deck</div>
        <div class="auth-sub">Enter a delegated Fortress token to open the control surface.</div>
        <form class="auth-form" id="auth-form">
          <label class="auth-label" for="auth-token">Delegated token</label>
          <input class="auth-input" id="auth-token" type="password" autocomplete="off" spellcheck="false" />
          <button class="action" type="submit">Authenticate</button>
        </form>
        <div class="auth-message" id="auth-message"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
