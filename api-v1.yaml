components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    UserTokenAuth:
      type: apiKey
      in: header
      name: X-User-Token
  schemas:
    Message:
      type: object
      properties:
        message:
          type: string
    MonitoringAlert:
      type: object
      properties:
        type:
          type: string
        value:
          type: number
        threshold:
          type: number
        message:
          type: string
    MemoryUsage:
      type: object
      properties:
        total_bytes:
          type: integer
        available_bytes:
          type: integer
        used_bytes:
          type: integer
        used_percent:
          type: number
    DiskUsage:
      type: object
      properties:
        total_bytes:
          type: integer
        used_bytes:
          type: integer
        free_bytes:
          type: integer
        used_percent:
          type: number
    HostCpuLoad:
      type: object
      properties:
        load_1m:
          type: number
        load_5m:
          type: number
        load_15m:
          type: number
        per_cpu_load_1m:
          type: number
        cpu_count:
          type: integer
        stat:
          $ref: "#/components/schemas/HostCpuStat"
    HostCpuStat:
      type: object
      properties:
        total_ticks:
          type: integer
        idle_ticks:
          type: integer
    HostNetwork:
      type: object
      properties:
        bytes_received:
          type: integer
        bytes_sent:
          type: integer
    HostMetrics:
      type: object
      properties:
        timestamp:
          type: string
        memory:
          $ref: "#/components/schemas/MemoryUsage"
        disk:
          $ref: "#/components/schemas/DiskUsage"
        cpu:
          $ref: "#/components/schemas/HostCpuLoad"
        network:
          $ref: "#/components/schemas/HostNetwork"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringAlert"
    ContainerCpu:
      type: object
      properties:
        usage_seconds:
          type: number
        usage_nanoseconds:
          type: integer
        limit:
          type: string
    ContainerMemory:
      type: object
      properties:
        usage_bytes:
          type: integer
        usage_peak_bytes:
          type: integer
        limit_bytes:
          type: integer
        used_percent:
          type: number
    ContainerDisk:
      type: object
      properties:
        usage_bytes:
          type: integer
        usage_peak_bytes:
          type: integer
        limit_bytes:
          type: integer
        used_percent:
          type: number
    ContainerNetwork:
      type: object
      properties:
        bytes_received:
          type: integer
        bytes_sent:
          type: integer
    ContainerMetrics:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        pid:
          type: integer
        processes:
          type: integer
        cpu:
          $ref: "#/components/schemas/ContainerCpu"
        memory:
          $ref: "#/components/schemas/ContainerMemory"
        disk:
          $ref: "#/components/schemas/ContainerDisk"
        network:
          $ref: "#/components/schemas/ContainerNetwork"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringAlert"
    MonitoringThresholds:
      type: object
      properties:
        memory_percent:
          type: number
        disk_percent:
          type: number
        load_per_cpu:
          type: number
    ContainerMonitoringThresholds:
      type: object
      properties:
        memory_percent:
          type: number
        memory_absolute_bytes:
          type: integer
        disk_percent:
          type: number
        disk_absolute_bytes:
          type: integer
        process_count:
          type: integer
    MonitoringAnomalyThresholds:
      type: object
      properties:
        host_cpu:
          type: object
          properties:
            multiplier:
              type: number
            min_usage_percent:
              type: number
        host_network:
          type: object
          properties:
            multiplier:
              type: number
            min_bytes_per_sec:
              type: integer
        container_cpu:
          type: object
          properties:
            multiplier:
              type: number
            min_cores:
              type: number
        container_network:
          type: object
          properties:
            multiplier:
              type: number
            min_bytes_per_sec:
              type: integer
    MonitoringSnapshot:
      type: object
      properties:
        timestamp:
          type: string
        host:
          $ref: "#/components/schemas/HostMetrics"
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerMetrics"
        alerts:
          type: object
          properties:
            host:
              type: array
              items:
                $ref: "#/components/schemas/MonitoringAlert"
            containers:
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/MonitoringAlert"
        anomalies:
          type: object
          properties:
            host:
              type: array
              items:
                $ref: "#/components/schemas/MonitoringAnomaly"
            containers:
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/MonitoringAnomaly"
        history:
          type: object
          properties:
            count:
              type: integer
            limit:
              type: integer
        thresholds:
          type: object
          properties:
            host:
              $ref: "#/components/schemas/MonitoringThresholds"
            containers:
              $ref: "#/components/schemas/ContainerMonitoringThresholds"
            anomalies:
              $ref: "#/components/schemas/MonitoringAnomalyThresholds"
    MonitoringAnomaly:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
        message:
          type: string
        interval_seconds:
          type: number
      additionalProperties: true
    ContainerCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        distro:
          type: string
          default: ubuntu:22.04
        cpu_limit:
          type: string
          default: "1"
        ram_limit:
          type: string
          default: 512MB
        disk_limit:
          type: string
          default: 10GB
    DomainRoute:
      type: object
      required: [domain, container_name]
      properties:
        domain:
          type: string
        domains:
          type: array
          items:
            type: string
        container_name:
          type: string
        container_port:
          type: integer
          default: 80
        container_interface:
          type: string
          default: eth0
        listen_address:
          type: string
          default: 0.0.0.0
        listen_port:
          type: integer
          default: 80
        tls:
          $ref: "#/components/schemas/DomainRouteTLS"
    DomainRouteTLS:
      type: object
      properties:
        mode:
          type: string
          enum: [manual, letsencrypt]
          default: manual
        cert_path:
          type: string
          nullable: true
