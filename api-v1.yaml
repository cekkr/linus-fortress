openapi: 3.0.3
info:
  title: Linus' Fortress API
  version: "1.0"
  description: |
    FastAPI service that orchestrates LXD containers, routing, access control, backups,
    firewall, and package management. Authentication can be done either via the master `X-API-Key`
    or delegated `X-User-Token`. Both headers are documented as security schemes below.
servers:
  - url: https://fortress.local:8443
    description: Fortress default listener (change host/port as needed)
security:
  - ApiKeyAuth: []
  - UserTokenAuth: []
paths:
  /status:
    get:
      summary: Retrieve system RAM/Disk stats and LXD container info
      tags: [Status]
      security:
        - ApiKeyAuth: []
        - UserTokenAuth: []
      responses:
        "200":
          description: System status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ram:
                    type: string
                  disk:
                    type: string
                  containers:
                    type: string
  /monitoring/resources:
    get:
      summary: Capture host and container resource usage with alert flags
      tags: [Status]
      security:
        - ApiKeyAuth: []
        - UserTokenAuth: []
      parameters:
        - in: query
          name: host_memory_threshold
          schema:
            type: number
            default: 90
          description: Trigger host memory alerts when percent used meets/exceeds this value.
        - in: query
          name: host_disk_threshold
          schema:
            type: number
            default: 90
          description: Trigger host disk alerts when percent used meets/exceeds this value.
        - in: query
          name: host_load_threshold
          schema:
            type: number
            default: 1.5
          description: Trigger host CPU alerts when 1m load divided by CPU count meets/exceeds this value.
        - in: query
          name: container_memory_threshold
          schema:
            type: number
            default: 85
          description: Percent threshold for container memory when a limit is present.
        - in: query
          name: container_disk_threshold
          schema:
            type: number
            default: 85
          description: Percent threshold for container disk usage when a quota is present.
        - in: query
          name: container_process_threshold
          schema:
            type: integer
            default: 300
          description: Maximum container process count before raising an alert.
        - in: query
          name: container_memory_absolute_mb
          schema:
            type: integer
            default: 1024
          description: Absolute memory threshold (MB) used when no container limit is configured.
        - in: query
          name: container_disk_absolute_gb
          schema:
            type: integer
            default: 5
          description: Absolute disk threshold (GB) used when no container quota is configured.
      responses:
        "200":
          description: Resource snapshot including alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSnapshot"
  /container/create:
    post:
      summary: Launch new LXD container with resource limits
      tags: [Containers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerCreate"
      responses:
        "200":
          description: Container creation acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/{name}:
    delete:
      summary: Stop and remove an existing container
      tags: [Containers]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Container deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms:
    get:
      summary: List registered VM test environments
      tags: [VMs]
      responses:
        "200":
          description: VM list
          content:
            application/json:
              schema:
                type: object
                properties:
                  vms:
                    type: array
                    items:
                      $ref: "#/components/schemas/VMSummary"
    post:
      summary: Create a VM record and provider resources
      tags: [VMs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMCreate"
      responses:
        "200":
          description: VM creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}:
    get:
      summary: Fetch a VM record
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: VM record
          content:
            application/json:
              schema:
                type: object
                properties:
                  vm:
                    $ref: "#/components/schemas/VMRecord"
    put:
      summary: Update a VM record
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMUpdate"
      responses:
        "200":
          description: Updated VM record
          content:
            application/json:
              schema:
                type: object
                properties:
                  vm:
                    $ref: "#/components/schemas/VMRecord"
    delete:
      summary: Remove a VM record
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: purge
          schema:
            type: boolean
            default: false
        - in: query
          name: force
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: VM deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/start:
    post:
      summary: Start a VM
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMStart"
      responses:
        "200":
          description: VM start result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/stop:
    post:
      summary: Stop a VM
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMStop"
      responses:
        "200":
          description: VM stop result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/status:
    get:
      summary: Fetch VM status
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: VM status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMStatus"
  /vms/{name}/snapshots:
    get:
      summary: List VM snapshots
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: "#/components/schemas/VMSnapshotRecord"
    post:
      summary: Create a VM snapshot
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMSnapshot"
      responses:
        "200":
          description: Snapshot creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/snapshots/{snapshot_name}/restore:
    post:
      summary: Restore a VM snapshot
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: snapshot_name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot restore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/snapshots/{snapshot_name}:
    delete:
      summary: Delete a VM snapshot
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: snapshot_name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/provision:
    post:
      summary: Provision a VM via SSH
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMProvision"
      responses:
        "200":
          description: Provisioning result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/probe:
    post:
      summary: Probe VM status via SSH
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMProbe"
      responses:
        "200":
          description: VM probe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  probe:
                    $ref: "#/components/schemas/VMProbeResult"
  /vms/{name}/states:
    get:
      summary: List saved VM probe states
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved VM states
          content:
            application/json:
              schema:
                type: object
                properties:
                  states:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /routing/add:
    post:
      summary: Configure nginx reverse proxy for a container
      tags: [Routing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainRoute"
      responses:
        "200":
          description: Routing setup acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /api-users:
    post:
      summary: Create delegated API user/token
      tags: [API Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIUserCreate"
      responses:
        "200":
          description: Created token and user metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/APIUserRecord"
    get:
      summary: List delegated API users
      tags: [API Users]
      responses:
        "200":
          description: List of API users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIUserRecordWithToken"
  /api-users/{token}:
    put:
      summary: Update delegated API user permissions or scope
      tags: [API Users]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIUserUpdate"
      responses:
        "200":
          description: Updated API user record
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/APIUserRecord"
    delete:
      summary: Delete delegated API user/token
      tags: [API Users]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /access/external/open:
    post:
      summary: Expose SSH/FTP via LXD proxy on the host
      tags: [Access Control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalAccessRule"
      responses:
        "200":
          description: Exposure result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  device_name:
                    type: string
  /access/external/close:
    post:
      summary: Remove proxy device for external access
      tags: [Access Control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalAccessCloseRequest"
      responses:
        "200":
          description: Removal acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users/create:
    post:
      summary: Create Linux user inside container
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserCreate"
      responses:
        "200":
          description: User creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users/password:
    post:
      summary: Update container user password
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserPasswordUpdate"
      responses:
        "200":
          description: Update acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users/groups:
    post:
      summary: Replace container user group memberships
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserGroupUpdate"
      responses:
        "200":
          description: Update acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users:
    delete:
      summary: Remove user from container
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserDelete"
      responses:
        "200":
          description: Removal acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/groups:
    post:
      summary: Ensure group exists inside container
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerGroupCreate"
      responses:
        "200":
          description: Group result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /containers/connect/tcp:
    post:
      summary: Create LXD proxy tunnel between containers
      tags: [Connectivity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerLinkRequest"
      responses:
        "200":
          description: Proxy creation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  device_name:
                    type: string
  /containers/expose:
    post:
      summary: Expose host ports/interfaces to a container (with optional firewall allowlist)
      tags: [Connectivity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiInterfaceExposeRequest"
      responses:
        "200":
          description: Exposure result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        device_name:
                          type: string
                        host_port:
                          type: integer
                        connect_port:
                          type: integer
                        target_ip:
                          type: string
                        protocol:
                          type: string
                        bind_address:
                          type: string
                  firewall_rules:
                    type: array
                    items:
                      type: object
                      properties:
                        port:
                          type: integer
                        protocol:
                          type: string
                        source:
                          type: string
  /containers/connect/tcp/remove:
    post:
      summary: Remove proxy device between containers
      tags: [Connectivity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerLinkRemoval"
      responses:
        "200":
          description: Removal acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /containers/connect/share:
    post:
      summary: Attach shared storage to containers
      tags: [Connectivity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedMountRequest"
      responses:
        "200":
          description: Shared mount attachment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  attachments:
                    type: array
                    items:
                      type: object
                      properties:
                        container:
                          type: string
                        device_name:
                          type: string
  /containers/connect/share/remove:
    post:
      summary: Detach shared storage mount
      tags: [Connectivity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedMountRemoval"
      responses:
        "200":
          description: Detach acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /firewall/open:
    post:
      summary: Open host firewall port
      tags: [Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirewallRule"
      responses:
        "200":
          description: Firewall action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /firewall/close:
    post:
      summary: Close host firewall port
      tags: [Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirewallRule"
      responses:
        "200":
          description: Firewall action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /packages/install:
    post:
      summary: Install packages on host or container
      tags: [Packages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInstallRequest"
      responses:
        "200":
          description: Install acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /packages/remove:
    post:
      summary: Remove packages from host or container
      tags: [Packages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageRemoveRequest"
      responses:
        "200":
          description: Removal acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /packages/update:
    post:
      summary: Update package repositories and upgrade
      tags: [Packages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdateRequest"
      responses:
        "200":
          description: Update acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  full_upgrade:
                    type: boolean
  /recipes:
    get:
      summary: List available automation recipes
      tags: [Recipes]
      responses:
        "200":
          description: Recipe summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecipeSummary"
    post:
      summary: Create a new automation recipe
      tags: [Recipes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeDefinition"
      responses:
        "200":
          description: Creation acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  recipe:
                    $ref: "#/components/schemas/RecipeDefinition"
  /recipes/{name}:
    get:
      summary: Retrieve a recipe by name
      tags: [Recipes]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recipe details
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipe:
                    $ref: "#/components/schemas/RecipeDefinition"
    put:
      summary: Update an existing recipe
      tags: [Recipes]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeUpdate"
      responses:
        "200":
          description: Update acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  recipe:
                    $ref: "#/components/schemas/RecipeDefinition"
    delete:
      summary: Delete a recipe
      tags: [Recipes]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /recipes/apply:
    post:
      summary: Apply a recipe (and optional dependencies) to host or container
      tags: [Recipes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeApplyRequest"
      responses:
        "200":
          description: Apply result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  recipe:
                    type: string
                  applied:
                    type: array
                    items:
                      type: string
                  container:
                    type: string
  /backup/{container_name}:
    post:
      summary: Trigger encrypted LXD backup
      tags: [Backups]
      parameters:
        - in: path
          name: container_name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Background task acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /backup/list:
    get:
      summary: List encrypted backup archives
      tags: [Backups]
      responses:
        "200":
          description: Backup filenames
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      type: string
  /backup/download/{filename}:
    get:
      summary: Download encrypted backup
      tags: [Backups]
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary encrypted archive
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /restore:
    post:
      summary: Restore encrypted backup into a container
      tags: [Backups]
      parameters:
        - in: query
          name: container_name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Restore result message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    UserTokenAuth:
      type: apiKey
      in: header
      name: X-User-Token
  schemas:
    Message:
      type: object
      properties:
        message:
