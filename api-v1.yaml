openapi: 3.0.3
info:
  title: Linus' Fortress API
  version: "1.0"
  description: |
    FastAPI service that orchestrates LXD containers, routing, access control, backups,
    firewall, and package management. Authentication can be done either via the master `X-API-Key`
    or delegated `X-User-Token`. Both headers are documented as security schemes below.
servers:
  - url: https://fortress.local:8443
    description: Fortress default listener (change host/port as needed)
security:
  - ApiKeyAuth: []
  - UserTokenAuth: []
paths:
  /status:
    get:
      summary: Retrieve system RAM/Disk stats and LXD container info
      tags: [Status]
      security:
        - ApiKeyAuth: []
        - UserTokenAuth: []
      responses:
        "200":
          description: System status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ram:
                    type: string
                  disk:
                    type: string
                  containers:
                    type: string
  /monitoring/resources:
    get:
      summary: Capture host and container resource usage with alert flags
      tags: [Status]
      security:
        - ApiKeyAuth: []
        - UserTokenAuth: []
      parameters:
        - in: query
          name: host_memory_threshold
          schema:
            type: number
            default: 90
          description: Trigger host memory alerts when percent used meets/exceeds this value.
        - in: query
          name: host_disk_threshold
          schema:
            type: number
            default: 90
          description: Trigger host disk alerts when percent used meets/exceeds this value.
        - in: query
          name: host_load_threshold
          schema:
            type: number
            default: 1.5
          description: Trigger host CPU alerts when 1m load divided by CPU count meets/exceeds this value.
        - in: query
          name: container_memory_threshold
          schema:
            type: number
            default: 85
          description: Percent threshold for container memory when a limit is present.
        - in: query
          name: container_disk_threshold
          schema:
            type: number
            default: 85
          description: Percent threshold for container disk usage when a quota is present.
        - in: query
          name: container_process_threshold
          schema:
            type: integer
            default: 300
          description: Maximum container process count before raising an alert.
        - in: query
          name: container_memory_absolute_mb
          schema:
            type: integer
            default: 1024
          description: Absolute memory threshold (MB) used when no container limit is configured.
        - in: query
          name: container_disk_absolute_gb
          schema:
            type: integer
            default: 5
          description: Absolute disk threshold (GB) used when no container quota is configured.
        - in: query
          name: history_limit
          schema:
            type: integer
            default: 120
          description: Number of snapshots to retain for baseline/anomaly detection (set to 0 to disable history retention).
        - in: query
          name: anomaly_baseline_samples
          schema:
            type: integer
            default: 6
          description: Number of recent samples used to build anomaly baselines.
        - in: query
          name: anomaly_host_cpu_multiplier
          schema:
            type: number
            default: 2.5
          description: Multiplier applied to the host CPU baseline before raising a spike alert.
        - in: query
          name: anomaly_host_cpu_min_percent
          schema:
            type: number
            default: 75
          description: Minimum host CPU percent to consider when evaluating spikes.
        - in: query
          name: anomaly_host_network_multiplier
          schema:
            type: number
            default: 3
          description: Multiplier applied to the host network baseline before raising a spike alert.
        - in: query
          name: anomaly_host_network_min_bytes_per_sec
          schema:
            type: integer
            default: 5242880
          description: Minimum host network throughput (bytes/sec) to consider when evaluating spikes.
        - in: query
          name: anomaly_container_cpu_multiplier
          schema:
            type: number
            default: 2.5
          description: Multiplier applied to the container CPU baseline before raising a spike alert.
        - in: query
          name: anomaly_container_cpu_min_cores
          schema:
            type: number
            default: 0.5
          description: Minimum container CPU usage (cores) to consider when evaluating spikes.
        - in: query
          name: anomaly_container_network_multiplier
          schema:
            type: number
            default: 3
          description: Multiplier applied to the container network baseline before raising a spike alert.
        - in: query
          name: anomaly_container_network_min_bytes_per_sec
          schema:
            type: integer
            default: 5242880
          description: Minimum container network throughput (bytes/sec) to consider when evaluating spikes.
      responses:
        "200":
          description: Resource snapshot including alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSnapshot"
  /container/create:
    post:
      summary: Launch new LXD container with resource limits
      tags: [Containers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerCreate"
      responses:
        "200":
          description: Container creation acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/{name}:
    delete:
      summary: Stop and remove an existing container
      tags: [Containers]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Container deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms:
    get:
      summary: List registered VM test environments
      tags: [VMs]
      responses:
        "200":
          description: VM list
          content:
            application/json:
              schema:
                type: object
                properties:
                  vms:
                    type: array
                    items:
                      $ref: "#/components/schemas/VMSummary"
    post:
      summary: Create a VM record and provider resources
      tags: [VMs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMCreate"
      responses:
        "200":
          description: VM creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}:
    get:
      summary: Fetch a VM record
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: VM record
          content:
            application/json:
              schema:
                type: object
                properties:
                  vm:
                    $ref: "#/components/schemas/VMRecord"
    put:
      summary: Update a VM record
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMUpdate"
      responses:
        "200":
          description: Updated VM record
          content:
            application/json:
              schema:
                type: object
                properties:
                  vm:
                    $ref: "#/components/schemas/VMRecord"
    delete:
      summary: Remove a VM record
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: purge
          schema:
            type: boolean
            default: false
        - in: query
          name: force
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: VM deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/start:
    post:
      summary: Start a VM
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMStart"
      responses:
        "200":
          description: VM start result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/stop:
    post:
      summary: Stop a VM
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMStop"
      responses:
        "200":
          description: VM stop result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/status:
    get:
      summary: Fetch VM status
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: VM status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMStatus"
  /vms/{name}/snapshots:
    get:
      summary: List VM snapshots
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: "#/components/schemas/VMSnapshotRecord"
    post:
      summary: Create a VM snapshot
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMSnapshot"
      responses:
        "200":
          description: Snapshot creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/snapshots/{snapshot_name}/restore:
    post:
      summary: Restore a VM snapshot
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: snapshot_name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot restore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/snapshots/{snapshot_name}:
    delete:
      summary: Delete a VM snapshot
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: snapshot_name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/provision:
    post:
      summary: Provision a VM via SSH
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMProvision"
      responses:
        "200":
          description: Provisioning result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /vms/{name}/probe:
    post:
      summary: Probe VM status via SSH
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMProbe"
      responses:
        "200":
          description: VM probe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  probe:
                    $ref: "#/components/schemas/VMProbeResult"
  /vms/{name}/states:
    get:
      summary: List saved VM probe states
      tags: [VMs]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved VM states
          content:
            application/json:
              schema:
                type: object
                properties:
                  states:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /routing/add:
    post:
      summary: Configure nginx reverse proxy for a container (optional TLS)
      tags: [Routing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainRoute"
      responses:
        "200":
          description: Routing setup acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /routing/refresh:
    post:
      summary: Refresh nginx configs for stored routing entries
      tags: [Routing]
      parameters:
        - in: query
          name: domain
          schema:
            type: string
          description: Optional primary domain to refresh; omit to refresh all routes.
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  refreshed:
                    type: array
                    items:
                      type: string
  /routing:
    get:
      summary: List configured nginx routing entries
      tags: [Routing]
      responses:
        "200":
          description: Routing list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingList"
  /routing/{domain}:
    delete:
      summary: Remove nginx routing entry
      tags: [Routing]
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Routing removed acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /tls/renew:
    post:
      summary: Renew Let's Encrypt certificates
      tags: [TLS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TLSRenewRequest"
      responses:
        "200":
          description: Renewal result
          content:
            application/json:
              schema:
                type: object
  /sites:
    get:
      summary: List managed websites
      tags: [Sites]
      responses:
        "200":
          description: Site list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteSummary"
    post:
      summary: Create a managed website
      tags: [Sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreateRequest"
      responses:
        "200":
          description: Site creation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  site:
                    $ref: "#/components/schemas/Site"
  /sites/{site_id}:
    get:
      summary: Retrieve a website by id
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Site detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  site:
                    $ref: "#/components/schemas/Site"
    put:
      summary: Update a website
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteUpdateRequest"
      responses:
        "200":
          description: Site update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  site:
                    $ref: "#/components/schemas/Site"
    delete:
      summary: Delete a website
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Site deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /sites/{site_id}/deploy:
    post:
      summary: Deploy website content
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteDeployRequest"
      responses:
        "200":
          description: Deploy result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /sites/{site_id}/backup:
    post:
      summary: Backup a website (files and optional database)
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteBackupRequest"
      responses:
        "200":
          description: Backup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteBackupResponse"
  /sites/{site_id}/rollback:
    post:
      summary: Roll back a website to a backup
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRollbackRequest"
      responses:
        "200":
          description: Rollback result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /sites/{site_id}/logs:
    get:
      summary: Fetch website logs
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
        - in: query
          name: service
          schema:
            type: string
          description: One of apache, nginx, php-fpm, or app.
        - in: query
          name: lines
          schema:
            type: integer
            default: 200
        - in: query
          name: since
          schema:
            type: string
          description: Optional ISO-8601 timestamp filter.
      responses:
        "200":
          description: Log output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteLogResponse"
  /sites/{site_id}/health:
    get:
      summary: Run website health checks
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Health check status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteHealthResponse"
  /sites/{site_id}/services/restart:
    post:
      summary: Restart website services
      tags: [Sites]
      parameters:
        - in: path
          name: site_id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteServiceActionRequest"
      responses:
        "200":
          description: Restart result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /api-users:
    post:
      summary: Create delegated API user/token
      tags: [API Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIUserCreate"
      responses:
        "200":
          description: Created token and user metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/APIUserRecord"
    get:
      summary: List delegated API users
      tags: [API Users]
      responses:
        "200":
          description: List of API users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIUserRecordWithToken"
  /api-users/{token}:
    put:
      summary: Update delegated API user permissions or scope
      tags: [API Users]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIUserUpdate"
      responses:
        "200":
          description: Updated API user record
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: "#/components/schemas/APIUserRecord"
    delete:
      summary: Delete delegated API user/token
      tags: [API Users]
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /access/external/open:
    post:
      summary: Expose SSH/FTP via LXD proxy on the host
      tags: [Access Control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalAccessRule"
      responses:
        "200":
          description: Exposure result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  device_name:
                    type: string
  /access/external/close:
    post:
      summary: Remove proxy device for external access
      tags: [Access Control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalAccessCloseRequest"
      responses:
        "200":
          description: Removal acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users/create:
    post:
      summary: Create Linux user inside container
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserCreate"
      responses:
        "200":
          description: User creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users/password:
    post:
      summary: Update container user password
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserPasswordUpdate"
      responses:
        "200":
          description: Update acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users/groups:
    post:
      summary: Replace container user group memberships
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserGroupUpdate"
      responses:
        "200":
          description: Update acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/users:
    delete:
      summary: Remove user from container
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerUserDelete"
      responses:
        "200":
          description: Removal acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /container/groups:
    post:
      summary: Ensure group exists inside container
      tags: [Container Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerGroupCreate"
      responses:
        "200":
          description: Group result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /containers/probe:
    post:
      summary: Probe container services and optionally update service labels
      tags: [Containers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainerServiceProbe"
      responses:
        "200":
          description: Service probe results
          content:
            application/json:
              schema:
                type: object
                properties:
                  container:
                    type: string
                  services:
                    type: object
                    additionalProperties:
                      type: boolean
                  available:
                    type: array
                    items:
                      type: string
                  missing:
                    type: array
                    items:
                      type: string
                  labels_updated:
                    type: boolean
                  label_value:
                    type: string
  /containers/connect/tcp:
    post:
      summary: Create LXD proxy tunnel between containers
      tags: [Connectivity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
